---
repos:
  # Meta hooks to check the pre-commit config itself
  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes

  # General purpose hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-yaml
      - id: no-commit-to-branch
      # -----------------------------------------
      # 1. Default rule: enforce LF everywhere except VS project
      # -----------------------------------------
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: |
          (?x)^(
            .*\.slnx$ |
            TITweaksMod/
          )

      # -----------------------------------------
      # 2. Override: enforce CRLF for VS project files
      # -----------------------------------------
      - id: mixed-line-ending
        name: mixed-line-ending (VS project files)
        args: [--fix=crlf]
        files: |
          (?x)^(
            .*\.slnx$ |
            TITweaksMod/
          )


  # Check markdown files
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: bf6d1792b8bc7f6cc93f10cc27735a4cb0c38e47  # frozen: v0.50.1
    hooks:
      - id: markdownlint

  # Check for common misspellings 1.
  - repo: https://github.com/crate-ci/typos
    rev: 276087d9a4f06398b3e04825487805e2d7375888  # frozen: v1.52.2
    hooks:
      - id: typos
        args: []
        types: [markdown]

  # Check for common misspellings 2.
  - repo: https://github.com/codespell-project/codespell
    rev: 57b21406f092110c18776e39b0bda50d37c945c8  # frozen: v2.4.3
    hooks:
      - id: codespell

  # CSharpier for C# reformatting
  - repo: local
    hooks:
      - id: dotnet-tool-restore
        name: Install .NET tools
        entry: dotnet tool restore
        # for pre-commit < 4.4.0 use language: system
        language: unsupported
        always_run: true
        pass_filenames: false
        stages:
          - commit
          - push
          - post-checkout
          - post-rewrite
        description: Install the .NET tools listed at .config/dotnet-tools.json.
      - id: csharpier
        name: Run CSharpier on C# files
        entry: dotnet tool run CSharpier format
        language: system
        types: [c#]
        exclude_types: [xml]
        description: CSharpier is an opinionated C# formatter inspired by Prettier.
