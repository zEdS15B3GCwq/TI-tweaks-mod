name: Test Workflow

on:  # yamllint disable-line rule:truthy
  pull_request:
    branches: ["main"]

jobs:
  run_script:
    runs-on: ubuntu-latest
    environment: ci
    steps:
      - name: v8 succeeds with classic token test
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.TEST_TOKEN }}
          script: |
            console.log("This is a test script running in GitHub Actions.");
